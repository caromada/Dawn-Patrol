name: Refresh buoy data

on:
  schedule:
    - cron: "*/30 * * * *"   # buoys report roughly half-hourly
  workflow_dispatch: {}       # manual refresh button

permissions:
  contents: write

concurrency:
  group: buoys
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and parse NDBC spectra
        run: node scripts/fetch-buoys.mjs
      - name: Run synthesis tests against the fresh spectrum
        run: node scripts/test-wave.mjs
      - name: Commit if changed
        run: |
          git config user.name "buoy-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no new observation"
          else
            git commit -m "data: buoy refresh $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
